name: TokenTest
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: token test
        timeout-minutes: 5
        run: |
          set +e
          echo  | base64 -d > /tmp/tt.py
          python3 /tmp/tt.py
          echo === STEP DONE ===
