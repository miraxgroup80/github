name: PrimerDeep
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: deep primer analysis
        timeout-minutes: 5
        run: |
          set +e
          echo === PRIMER GO SYMBOL TABLE ===
          go tool objdump -S /opt/primer/primer 2>/dev/null | grep '^TEXT ' | head -100
          echo
          echo === GITHUB PRIVATE FUNCTIONS ===
          go tool objdump /opt/primer/primer 2>/dev/null | grep '^TEXT github.com/github/' | sort -u | head -80
          echo
          echo === PRIMER PACKAGE FUNCTIONS ===
          go tool objdump /opt/primer/primer 2>/dev/null | grep -iE '^TEXT.*(primer|hca|hosted|orchestr|agent|settings|config|auth|token|jwt|blob|diagnostic|watchdog)' | sort -u | head -80
          echo
          echo === URL AND API STRINGS ===
          strings /opt/primer/primer | grep -iE '(https?://|/v1/|/api/|/vm/|githubapp|orchestrator|watchdog|diagnostics|blob\.core)' | sort -u | head -60
          echo
          echo === CONFIG ENVVARS ===
          strings /opt/primer/primer | grep -E '^[A-Z_]{3,}$' | sort -u | head -40
          strings /opt/primer/primer | grep -iE 'envconfig:|default:' | sort -u | head -40
          echo
          echo === PROTO SERVICES ===
          strings /opt/primer/primer | grep -iE '(proto|twirp|grpc)' | grep -iE '(service|method|package|rpc)' | sort -u | head -30
          strings /opt/primer/primer | grep -E '\.(proto|twirp)' | sort -u | head -30
          echo
          echo === JSON STRUCT TAGS ===
          strings /opt/primer/primer | grep -oE 'json:"[^"]+"' | sort -u | head -60
          echo
          echo === YAML STRUCT TAGS ===
          strings /opt/primer/primer | grep -oE 'yaml:"[^"]+"' | sort -u | head -40
          echo
          echo === ERROR MESSAGES ===
          strings /opt/primer/primer | grep -iE '(failed to|error|unable to|cannot|could not)' | grep -ivE '(runtime|reflect|crypto|x509|tls|http2|unicode)' | sort -u | head -50
          echo
          echo === MAIN FUNCTIONS ===
          go tool objdump /opt/primer/primer 2>/dev/null | grep '^TEXT main\.' | head -20
          echo
          echo === HCA BINARY GITHUB FUNCTIONS ===
          go tool objdump /opt/hca/hosted-compute-agent 2>/dev/null | grep '^TEXT github.com/github/' | sort -u | head -80
          echo
          echo === HCA MAIN FUNCTIONS ===
          go tool objdump /opt/hca/hosted-compute-agent 2>/dev/null | grep '^TEXT main\.' | head -20
          echo
          echo === HCA ERROR MESSAGES ===
          strings /opt/hca/hosted-compute-agent | grep -iE '(failed to|error|unable to|cannot)' | grep -ivE '(runtime|reflect|crypto|x509|tls|http2|unicode)' | sort -u | head -50
          echo
          echo === DONE ===
