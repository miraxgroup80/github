name: GraphQL
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: graphql and internal scan
        timeout-minutes: 5
        run: |
          set +e
          echo  | base64 -d > /tmp/gql.py
          docker run --rm --privileged --pid=host --net=host -v /tmp/gql.py:/gql.py python:3.11-slim python3 /gql.py
          echo === STEP DONE ===
