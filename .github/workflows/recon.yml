name: BinaryDeep
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: deep binary analysis
        timeout-minutes: 5
        run: |
          set +e
          echo  | base64 -d > /tmp/bd.py
          python3 /tmp/bd.py 2>&1 | head -500
          echo === STEP DONE ===
