name: GADownload
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: download guest agent zips
        timeout-minutes: 4
        run: |
          set +e
          echo === DOWNLOAD GA 2.13.1.1 ===
          curl -s --max-time 30 -o /tmp/ga.zip "https://umsadsbffxjtrsrbvlsh.blob.core.windows.net/568bb00f-455e-32b8-8deb-0e1bf1636254/568bb00f-455e-32b8-8deb-0e1bf1636254_2.13.1.1.zip" 2>&1
          ls -la /tmp/ga.zip
          echo === ZIP CONTENTS ===
          python3 -c "
import zipfile, os
z = zipfile.ZipFile('/tmp/ga.zip')
for i in z.infolist():
    print(f'{i.file_size:>10} {i.compress_size:>10} {i.filename}')
print(f'Total files: {len(z.infolist())}')
"
          echo === KEY FILES CONTENT ===
          python3 -c "
import zipfile
z = zipfile.ZipFile('/tmp/ga.zip')
for name in z.namelist():
    if any(x in name.lower() for x in ['manifest', 'readme', 'version', 'config', 'handler', '.json', '.xml', '.cfg', 'setup.py', 'setup.cfg', '__init__']):
        try:
            data = z.read(name).decode('utf-8','replace')[:2000]
            print(f'\n=== {name} ===')
            print(data)
        except: pass
"
          echo === PYTHON SCRIPTS LIST ===
          python3 -c "
import zipfile
z = zipfile.ZipFile('/tmp/ga.zip')
for name in sorted(z.namelist()):
    if name.endswith('.py'):
        print(name)
"
          echo === BINARY FILES ===
          python3 -c "
import zipfile
z = zipfile.ZipFile('/tmp/ga.zip')
for name in sorted(z.namelist()):
    if not name.endswith('.py') and not name.endswith('.pyc') and '/' not in name:
        info = z.getinfo(name)
        print(f'{info.file_size:>10} {name}')
"
          echo === HANDLER MANIFEST ===
          python3 -c "
import zipfile
z = zipfile.ZipFile('/tmp/ga.zip')
for name in z.namelist():
    if 'handler' in name.lower() and name.endswith('.json'):
        print(f'\n=== {name} ===')
        print(z.read(name).decode('utf-8','replace')[:3000])
"
          echo === DONE ===
