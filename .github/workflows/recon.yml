name: TwirpScan
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: twirp endpoint scan
        timeout-minutes: 5
        run: |
          set +e
          JWT=$(python3 -c "import json; print(json.loads(open('/opt/hca/.settings','rb').read())['authToken'])")
          BASE=$(python3 -c "import json; s=json.loads(open('/opt/hca/.settings','rb').read()); print(s['schedulerApiUrl'].replace('/v1',''))")
          AUTH="Authorization: Bearer $JWT"
          CT="Content-Type: application/json"
          echo "Base: $BASE"
          echo
          echo === TWIRP ON ORCHESTRATOR ===
          SVC=github.actions.run_service.api.twirp.v1.RunService
          for method in CancelPlan GetPlan GetConfiguration GetCallbacks GetOidcConfig GetTenantInfo GetAbuseInfo GetProperties GetContext GetGithubEventInfo GetTargetRepository GetBillingPlanOwner GetRerunContext CreatePlan; do
            RESP=$(curl -s --max-time 5 -w '\nHTTP_%{http_code}' -X POST -H "$AUTH" -H "$CT" -d '{}' "$BASE/twirp/$SVC/$method" 2>&1)
            CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | head -5 | head -c 300)
            echo "$method: $CODE $BODY"
          done
          echo
          echo === OTHER TWIRP SERVICES ===
          for svc in github.actions.run_service.api.twirp.v1.OidcConfigService github.actions.run_service.api.twirp.v1.CallbacksService github.actions.run_service.api.twirp.v1.ConfigurationService; do
            RESP=$(curl -s --max-time 5 -w '\nHTTP_%{http_code}' -X POST -H "$AUTH" -H "$CT" -d '{}' "$BASE/twirp/$svc/Get" 2>&1)
            CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | head -3 | head -c 200)
            echo "$svc/Get: $CODE $BODY"
          done
          echo
          echo === V1 ENDPOINTS ===
          for ep in request trace heartbeat cancel finish start notify config settings status health ready alive version info metrics; do
            RESP=$(curl -s --max-time 3 -w '\nHTTP_%{http_code}' -X POST -H "$AUTH" -H "$CT" -d '{}' "$BASE/v1/$ep" 2>&1)
            CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | head -3 | head -c 200)
            echo "POST /v1/$ep: $CODE $BODY"
          done
          echo
          echo === V1 GET ENDPOINTS ===
          for ep in request trace heartbeat cancel status health ready alive version info metrics config; do
            RESP=$(curl -s --max-time 3 -w '\nHTTP_%{http_code}' -H "$AUTH" "$BASE/v1/$ep" 2>&1)
            CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | head -3 | head -c 200)
            echo "GET /v1/$ep: $CODE $BODY"
          done
          echo
          echo === WATCHDOG ENDPOINTS ===
          WATCHDOG=$(python3 -c "import json; print(json.loads(open('/opt/hca/.settings','rb').read()).get('watchdogTraceApiUrl',''))")
          WBASE=$(echo $WATCHDOG | sed 's|/v1/trace||')
          echo "Watchdog base: $WBASE"
          for ep in trace health status config version info; do
            RESP=$(curl -s --max-time 3 -w '\nHTTP_%{http_code}' -X POST -H "$AUTH" -H "$CT" -d '[]' "$WBASE/v1/$ep" 2>&1)
            CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | head -3 | head -c 200)
            echo "watchdog /v1/$ep: $CODE $BODY"
          done
          echo
          echo === VM V1 ENDPOINTS ===
          for ep in request status config heartbeat cancel finish; do
            RESP=$(curl -s --max-time 3 -w '\nHTTP_%{http_code}' -X POST -H "$AUTH" -H "$CT" -d '{}' "$BASE/vm/v1/$ep" 2>&1)
            CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | head -3 | head -c 200)
            echo "POST /vm/v1/$ep: $CODE $BODY"
          done
          echo
          echo === HCA SETTINGS FULL KEYS ===
          python3 -c "import json; d=json.loads(open('/opt/hca/.settings','rb').read()); print('\n'.join(f'{k}: {str(v)[:80]}' for k,v in d.items() if k != 'authToken'))"
          echo
          echo === DONE ===
