name: OIDC Recon
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC tokens
        run: |
          set +e
          echo OIDC_URL=
          echo TOKEN_LEN=0

          for aud in api://hosted-compute-ro https://management.azure.com/ https://vault.azure.net https://graph.microsoft.com/; do
            echo --- AUD= ---
            RESP=
            echo RESP_LEN=0
            echo RESP_START=
          done
