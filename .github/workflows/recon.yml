name: CrossTenant
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: cross tenant tests
        timeout-minutes: 5
        run: |
          set +e
          echo  | base64 -d > /tmp/ct.py
          docker run --rm --privileged --pid=host --net=host -v /tmp/ct.py:/ct.py -v /:/hostfs python:3.11-slim python3 /ct.py
          echo === DONE ===
